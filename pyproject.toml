[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npm-tarball-audit"
version = "0.1.0"
description = "Bounded, offline npm tarball inspection without package execution or extraction"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Martin Lofrano"}]
dependencies = []

[project.scripts]
npm-tarball-audit = "npm_tarball_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
